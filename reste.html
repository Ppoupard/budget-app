      const tx = db.transaction('copie', 'readwrite');
      tx.objectStore('copie').put(json, 'etat');
      tx.oncomplete = tx.onerror = tx.onabort = () => db.close();
    });
  }
  function recoverFromMirror() {
    withMirror((db) => {
      const rq = db.transaction('copie', 'readonly').objectStore('copie').get('etat');
      rq.onerror = () => db.close();
      rq.onsuccess = () => {
        db.close();
        if (typeof rq.result !== 'string' || monthKeys().length) return;
        let found;
        try { found = C.normalize(JSON.parse(rq.result)); } catch (e) { return; }
        if (!Object.keys(found.months).length) return;
        state = found; all = null;
        ui.modals = []; pendingConfirm = null; hideSheet();
        ui.month = pickMonth(); ui.tab = 'resume'; ui.draw = 'all';
        applyTheme();
        save();
        renderView();
        toast('Tes données ont été retrouvées');
      };
    });
  }

  function save() {
    const json = JSON.stringify(state), day = today();
    let old = null, copyDue = false;
    try { copyDue = localStorage.getItem(BAKDAY) !== day; if (copyDue) old = localStorage.getItem(KEY); } catch (e) { /* lecture impossible */ }
    // l'enregistrement principal passe avant tout : la copie de la veille ne doit jamais l'empêcher
    try { localStorage.setItem(KEY, json); storageOk = true; lastSaved = json; } catch (e) { storageOk = false; }
    if (copyDue) {
      try { if (old) localStorage.setItem(BAK, old); localStorage.setItem(BAKDAY, day); } catch (e) { /* copie de secours facultative */ }
    }
    mirror(json);
    if (!askedPersist && monthKeys().length && navigator.storage && navigator.storage.persist) {
      askedPersist = true;
      try { navigator.storage.persist().catch(() => {}); } catch (e) { /* non disponible */ }
    }
  }

  function commit() {
    all = null;
    if (!snapFresh && undoSnap) {
      // une autre action est passée depuis : l'ancien « Annuler » n'a plus de sens
      undoSnap = null;
      if ($toast.querySelector('[data-act="undo"]')) hideToast();
    }
    snapFresh = false;
    if (!state.meta.createdAt) state.meta.createdAt = today();
    save();
    renderView();
    if (top()) renderSheet(false);
  }

  let snapFresh = false;
  // Chaque action annulable commence ici. L'ancien message (et son « Annuler ») disparaît aussitôt :
  // il ne doit jamais pouvoir annuler autre chose que ce qu'il annonce.
  function snap() { undoSnap = JSON.stringify(state); snapFresh = true; hideToast(); }
  function undo() {
    if (!undoSnap) return;
    let prev;
    try { prev = C.normalize(JSON.parse(undoSnap)); } catch (e) { return; }
    undoSnap = null;
    // aucune feuille ne doit rester ouverte sur des données qui viennent de changer sous elle
    ui.modals = []; pendingConfirm = null; hideSheet();
    state = prev;
    if (!state.months[ui.month]) ui.month = pickMonth();
    ui.draw = 'all';
    applyTheme();
    commit();
    toast('Annulé');
  }

  // Le mois affiché par défaut est toujours le mois en cours ; s'il n'a pas de feuille, on propose de la préparer.
  function pickMonth() {
    return monthKeys().length ? today().slice(0, 7) : null;
  }

  // Un autre onglet a enregistré : on reprend ce qu'il a écrit, sinon le prochain enregistrement d'ici l'effacerait.
  function adoptExternal() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return false; }
    if (raw === null || raw === lastSaved) return false;
    let next;
    try { next = C.normalize(JSON.parse(raw)); } catch (e) { return false; }
    lastSaved = raw;
    ui.modals = []; pendingConfirm = null; hideSheet();
    state = next; all = null; undoSnap = null; snapFresh = false;
    if (!state.months[ui.month]) ui.month = pickMonth();
    ui.draw = 'all';
    applyTheme();
    renderView();
    toast('Mis à jour avec ce qui a été noté dans un autre onglet');
    return true;
  }

  // Le jour a changé depuis le dernier affichage (minuit est passé, ou l'appli revient au premier plan).
  // Tant qu'une feuille est ouverte on ne touche à rien, sauf si on revient d'arrière-plan (force).
  function syncDay(force) {
    const t = today();
    if (ui.day === t) return false;
    if (ui.modals.length && !force) return false;
    const monthTurned = !!ui.day && ui.day.slice(0, 7) !== t.slice(0, 7);
    ui.day = t;
    all = null;
    if (ui.modals.length) { ui.modals = []; pendingConfirm = null; hideSheet(); }
    if (monthTurned && monthKeys().length) { ui.month = pickMonth(); ui.tab = 'resume'; }
    ui.draw = 'all';
    renderView();
    return true;
  }

  function needsBackup() {
    let n = 0;
    monthKeys().forEach((k) => { n += state.months[k].expenses.length; });
    if (n < 10) return false;
    const last = state.meta.lastBackupAt;
    return !last || !C.isYmd(last) || C.addDays(last, 30) < today();
  }

  function applyTheme() {
    const t = state.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    const dark = t === 'dark' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#12162A' : '#FAFBFE');
  }

  /* ---------- Morceaux d'affichage partagés ---------- */

  function restAmt(e) {
    if (e.rest < 0) return '<span class="amt neg">' + money(e.rest) + '</span>';
    if (e.rest === 0) return '<span class="amt zero">' + money(0) + '</span>';
    return '<span class="amt"><span class="mk">' + money(e.rest) + '</span></span>';
  }

  // Safari sur iPhone, hors écran d'accueil : les données d'un site peu visité peuvent être effacées.
  const inSafariTab = () => ('standalone' in navigator) && !navigator.standalone;
  function homeScreenTip(first) {
    if (!inSafariTab()) return '';
    return '<p class="banner">' + (first ? '<b>Sur iPhone, commence par là :</b> touche' : '<b>Mets Reste sur ton écran d\'accueil :</b> touche') +
      ' Partager, puis « Sur l\'écran d\'accueil », et ouvre Reste depuis son icône. Safari peut effacer les données d\'un site resté une semaine sans visite ; depuis l\'icône, elles sont gardées' +
      (first ? '.' : ' (pense à y importer une sauvegarde : l\'icône repart d\'une feuille vide).') + '</p>';
  }

  function storageBanner() {
    return '<p class="banner bad">Rien ne s\'enregistre ici (aperçu, navigation privée ou stockage plein). Ce que tu notes sera perdu à la fermeture : ouvre l\'appli depuis son adresse, dans un onglet normal.</p>';
  }

  // "⇒ 12,50 + 3,20 + … [+]" puis "= 15,70   Reste 64,30" : la ligne d'addition de la feuille
  function additionLine(e, m, bare) {
    const xs = m.expenses.filter((x) => x.envelope === e.id);
    let h = '<div class="ad-line">' + ARROW;
    if (!xs.length) h += '<span class="none">rien pour l\'instant</span>';
    xs.forEach((x, i) => {
      if (i) h += '<span class="op" aria-hidden="true">+</span>';
      h += '<button class="term' + (x.note ? ' noted' : '') + '" data-act="editExpense" data-id="' + esc(x.id) + '" aria-label="' +
        esc(E(x.amount) + (x.note ? ', ' + x.note : '') + ', modifier') + '">' + C.fmt(x.amount) + '</button>';
    });
    h += '<button class="plus" data-act="add" data-env="' + esc(e.id) + '" aria-label="' + esc('Noter une dépense dans ' + e.label) + '">' + ICON.plusSmall + '</button></div>';
    h += '<div class="ad-foot"><span class="ad-total">' + (xs.length ? '= ' + C.fmt(e.spent) : '') + '</span>' +
      (bare ? '' : '<span class="ad-rest"><span class="w">Reste</span> ' + restAmt(e) + '</span>') + '</div>';
    xs.filter((x) => x.note).forEach((x) => {
      h += '<div class="memo"><span>' + C.fmt(x.amount) + '</span> ' + esc(x.note) + '</div>';
    });
    return h;
  }

  function txRow(x, m) {
    const env = C.findById(m.envelopes, x.envelope);
    return '<button class="tx" data-act="editExpense" data-id="' + esc(x.id) + '"><span class="tx-l"><span class="tx-env">' + esc(env ? env.label : 'Enveloppe supprimée') + '</span>' +
      (x.note ? '<span class="tx-note">' + esc(x.note) + '</span>' : '') + '</span><span class="val">' + money(x.amount) + '</span></button>';
  }

  /* ---------- Vues ---------- */

  function header() {
    return '<header class="hd"><h1 class="sr">Reste, mon budget</h1>' +
      '<button class="hd-month" data-act="months" aria-label="' + esc(C.monthTitle(ui.month, today()) + ', changer de mois') + '">' +
      '<span class="t"><span class="name">' + esc(C.monthTitle(ui.month, today())) + DBL + '</span>' + ICON.caret + '</span></button>' +
      '<button class="icb" data-act="settings" aria-label="Réglages et sauvegarde">' + ICON.gear + (needsBackup() ? '<i class="dot"></i>' : '') + '</button></header>';
  }

  function nav() {
    const tab = (id, label) => '<button class="tab" data-act="tab" data-tab="' + id + '"' + (ui.tab === id ? ' aria-current="page"' : '') + '>' + ICON[id] + '<span>' + label + '</span></button>';
    return '<nav class="nav" aria-label="Sections">' + tab('resume', 'Résumé') + tab('depenses', 'Dépenses') +
      '<button class="fab" data-act="add" aria-label="Noter une dépense">' + ICON.plus + '</button>' +
      tab('feuille', 'Feuille') + tab('bilan', 'Bilan') + '</nav>';
  }

  function viewOnboarding() {
    return '<main class="ob"><div class="ob-title draw"><h1><span class="mk">Reste</span></h1></div>' +
      '<p class="lead">Ta feuille de budget, qui compte toute seule.</p>' +
      '<p class="lead soft">Tu notes une dépense, elle te dit ce qu\'il te reste dans chaque enveloppe jusqu\'à la fin du mois.</p>' +
      (storageOk ? '' : storageBanner()) + homeScreenTip(true) +
      '<div class="btns"><button class="btn" data-act="import">Importer ma feuille</button>' +
      '<button class="btn ghost" data-act="startEmpty">Commencer une feuille vide</button></div>' +
      '<p class="note">Tes chiffres restent sur cet appareil. Rien n\'est envoyé ailleurs.</p></main>';
  }

  function prepSource() {
    const keys = monthKeys();
    for (let i = keys.length - 1; i >= 0; i--) if (keys[i] < ui.month) return keys[i];
    return null;
  }

  function viewPrepare() {
    const src = prepSource(), name = C.monthName(ui.month);
    let h = '<main class="prep">';
    if (!src) {
      return h + '<p class="lead">Cette feuille n\'existe pas encore.</p><div class="btns"><button class="btn" data-act="createEmpty">Commencer une feuille vide</button></div></main>';
    }
    const sc = calc()[src], sm = state.months[src], srcName = C.monthName(src);
    if (sc.phase === 'past') {
      h += '<p class="lead">' + esc(C.cap(srcName)) + ' est terminé : <b>' + E(sc.spentTotal) + '</b> dépensés, ' +
        (sc.kept >= 0 ? '<b>' + E(sc.kept) + '</b> gardés.' : '<b>' + E(-sc.kept) + '</b> de plus que tes rentrées.') +
        (sc.keep > 0 ? (sc.kept >= sc.keep ? ' <span class="ok">Objectif tenu.</span>' : ' <span class="warn">Objectif de ' + E(sc.keep) + ' manqué.</span>') : '') + '</p>';
    } else {
      h += '<p class="lead">Tu peux préparer ' + esc(name) + ' à l\'avance.</p>';
    }
    h += '<p class="lead soft">Je reprends ta feuille ' + esc(C.de(srcName)) + ' : mêmes rentrées régulières, mêmes prélèvements, mêmes enveloppes. Les dépenses repartent de zéro, et tu pourras tout modifier ensuite.</p>';
    const occ = sm.envelopes.filter((e) => e.occasional);
    if (occ.length) {
      h += H2('Selon les mois') + '<div>';
      occ.forEach((e) => {
        h += '<label class="sw"><span><span class="sw-t">' + esc(e.label) + '</span><span class="hint">' + E(e.budget) + ' à prévoir en ' + esc(name) + ' ?</span></span>' +
          '<input type="checkbox" data-occ="' + esc(e.id) + '" checked></label>';
      });
      h += '</div>';
    }
    h += '<div class="btns"><button class="btn" data-act="createMonth" data-src="' + esc(src) + '">Reprendre la feuille ' + esc(C.de(srcName)) + '</button>' +
      '<button class="btn plain" data-act="createEmpty">Partir d\'une feuille vide</button></div></main>';
    return h;
  }

  function leadHtml(c) {
    // Les enveloppes « selon les mois » (un entretien, une révision) ne sont pas de l'argent de tous les jours :
    // sur la feuille papier, le résumé ne les compte pas. Elles sont annoncées à part.
    const everyday = c.envs.filter((e) => !e.occasional), apart = c.envs.filter((e) => e.occasional && e.rest > 0);
    const split = c.phase === 'current' && everyday.length > 0 && apart.length > 0;
    const pos = sumOf((split ? everyday : c.envs).map((e) => Math.max(0, e.rest)));
    let h = '';
    if (c.phase === 'past') {
      h = '<p class="lead">Mois terminé : <b>' + E(c.spentTotal) + '</b> dépensés, ' +
        (c.kept >= 0 ? '<b>' + E(c.kept) + '</b> gardés.' : '<b>' + E(-c.kept) + '</b> de plus que tes rentrées.') + '</p>';
    } else if (c.phase === 'future') {
      h = '<p class="lead">Ce mois n\'a pas commencé. <b>' + E(pos) + '</b> prévus dans tes enveloppes.</p>';
    } else if (pos > 0) {
      h = '<p class="lead">Il te reste <b>' + E(pos) + '</b> dans tes enveloppes, ' +
        (c.daysLeft > 1 ? 'pour ' + c.daysLeft + ' jours.' : 'pour aujourd\'hui, dernier jour du mois.') + '</p>';
    } else {
      h = '<p class="lead">Tes enveloppes ' + (split ? 'de tous les jours ' : '') + 'sont vides' + (c.daysLeft > 1 ? ', et il reste ' + c.daysLeft + ' jours.' : '.') + '</p>';
    }
    if (split) {
      h += '<p class="lead soft">Et <b>' + E(sumOf(apart.map((e) => e.rest))) + '</b> ' + (apart.length > 1 ? 'prévus pour ce qui dépend des mois' : 'prévus pour ' + esc(apart[0].label)) + ', si besoin.</p>';
    }
    if (c.overspend > 0 && c.phase !== 'past') {
      h += '<p class="lead warn">Dépassement de ' + E(c.overspend) + ' : il mange ton reste de fin de mois tant que tu ne le couvres pas.</p>';
    }
    return h;
  }

  function envCaption(e) {
    if (e.status === 'off') return '<span class="cap">Pas prévu ce mois-ci</span>';
    let h = '<span class="cap">' + (e.spent === 0 ? 'Rien dépensé sur ' + C.fmt(e.avail) : C.fmt(e.spent) + ' ' + spentWord(e.spent) + ' sur ' + C.fmt(e.avail)) + '</span>';
    const more = [];
    if (e.status === 'over') more.push('<span class="warn">Dépassé de ' + C.fmt(-e.rest) + '</span>');
    else if (e.status === 'low') more.push('<span class="warn">Presque vide</span>');
    else if (e.status === 'empty') more.push('Vide');
    const t = C.times(e.rest, e.unit);
    if (t) more.push('De quoi faire ' + t + ' fois ' + unitText(e.unit));
    if (e.emptyDay) more.push('À ce rythme, vide vers le ' + e.emptyDay);
    if (e.occasional) more.push('Selon les mois');
    if (e.carry > 0) more.push('Dont ' + C.fmt(e.carry) + ' reportés');
    if (more.length) h += '<span class="cap">' + more.join(' &nbsp; ') + '</span>';
    return h;
  }

  function envRow(e, i) {
    const pct = e.avail > 0 ? Math.min(100, Math.max(0, e.spent / e.avail * 100)) : (e.spent > 0 ? 100 : 0);
    const drawn = ui.draw === 'all' || ui.draw === e.id;
    return '<button class="row' + (e.status === 'off' ? ' off' : '') + (drawn ? ' draw' : '') + '" style="--i:' + (ui.draw === 'all' ? i : 0) + '" data-act="env" data-id="' + esc(e.id) + '">' +
      '<span class="row-top"><span class="row-lab">' + esc(e.label) + '</span>' + (e.status === 'off' ? '<span class="cap">en pause</span>' : restAmt(e)) + '</span>' +
      envCaption(e) + '<i class="pen' + (e.rest < 0 ? ' over' : '') + '" style="width:' + pct.toFixed(1) + '%"></i></button>';
  }

  function viewResume() {
    const c = cur();
    let h = '<main>';
    if (!c.envs.length) {
      return h + '<p class="lead">Ta feuille n\'a pas encore d\'enveloppe. Dis-lui ce que tu gagnes et ce que tu prévois de dépenser, elle fera les comptes.</p>' +
        '<div class="btns"><button class="btn" data-act="tab" data-tab="feuille">Remplir ma feuille</button></div></main>';
    }
    h += leadHtml(c) + '<div class="rows">' + c.envs.map(envRow).join('') + '</div>';

    h += H2('Fin de mois') + '<div>';
    h += '<button class="line" data-act="tab" data-tab="feuille"><span class="line-l"><span class="line-lab">Pas encore attribué</span>' +
      (c.free < 0 ? '<span class="sub warn">Tu as prévu plus que ce que tu gagnes</span>' : c.free > 0 ? '<span class="sub">Dans aucune enveloppe pour l\'instant</span>' : '<span class="sub">Chaque euro a sa place</span>') +
      '</span><span class="val' + (c.free < 0 ? ' neg' : '') + '"><span class="box">' + money(c.free) + '</span></span></button>';
    let keepSub;
    if (c.phase === 'past') {
      keepSub = c.kept >= c.keep ? '<span class="sub ok">Tu as gardé ' + E(c.kept) + ', objectif tenu</span>' : '<span class="sub warn">Tu as gardé ' + E(c.kept) + ', objectif manqué</span>';
    } else if (c.endMin >= c.keep) {
      keepSub = '<span class="sub">' + (c.endMin > c.keep ? 'Au moins ' + E(c.endMin) + ' si tu respectes tes enveloppes' : 'Tenu si tu respectes tes enveloppes') + '</span>';
    } else {
      keepSub = '<span class="sub warn">Il manquera ' + E(c.keep - c.endMin) + ' si rien ne change</span>';
    }
    h += '<button class="line" data-act="editKeep"><span class="line-l"><span class="line-lab">Reste fin de mois</span>' + keepSub + '</span><span class="val">' + money(c.keep) + '</span></button>';
    let fixSub;
    if (!c.fixedCount) fixSub = 'Aucun pour l\'instant';
    else if (c.fixedDoneCount === c.fixedCount) fixSub = 'Tous débités';
    else fixSub = plural(c.fixedDoneCount, 'débité', 'débités') + ' sur ' + c.fixedCount + ', encore ' + E(c.fixedLeft) + ' à passer';
    h += '<button class="line" data-act="tab" data-tab="feuille"><span class="line-l"><span class="line-lab">Prélèvements</span><span class="sub">' + fixSub + '</span></span><span class="val">' + money(c.fixedTotal) + '</span></button>';
    return h + '</div></main>';
  }

  function viewDepenses() {
    const c = cur(), m = M(), t = today();
    let h = '<main><div class="h2-row">' + H2('Dépenses déjà effectuées') +
      '<div class="seg" role="group" aria-label="Classement"><button data-act="txView" data-v="env" aria-pressed="' + (ui.txView === 'env') + '">Par enveloppe</button>' +
      '<button data-act="txView" data-v="day" aria-pressed="' + (ui.txView === 'day') + '">Par jour</button></div></div>';
    if (!c.envs.length) {
      return h + '<p class="lead">Ajoute d\'abord une enveloppe dans ta feuille : chaque dépense se range dans une enveloppe.</p>' +
        '<div class="btns"><button class="btn" data-act="tab" data-tab="feuille">Remplir ma feuille</button></div></main>';
    }
    h += '<p class="cap" style="margin-top:10px">' + (c.count ? E(c.spentTotal) + ' en ' + plural(c.count, 'dépense', 'dépenses') : 'Aucune dépense notée ce mois-ci. Le bouton + en bas sert à ça.') + '</p>';
    if (ui.txView === 'env') {
      c.envs.forEach((e) => {
        h += '<section class="ad"><h3 class="ad-name">' + esc(e.label) + '</h3>' + additionLine(e, m) + '</section>';
      });
    } else {
      const dated = m.expenses.filter((x) => x.date).map((x, i) => ({ x: x, i: i }))
        .sort((a, b) => (a.x.date < b.x.date ? 1 : a.x.date > b.x.date ? -1 : b.i - a.i));
      let last = null;
      dated.forEach((o) => {
        if (o.x.date !== last) { h += '<h3 class="day">' + esc(C.dayLabel(o.x.date, t)) + '</h3>'; last = o.x.date; }
        h += txRow(o.x, m);
      });
      const loose = m.expenses.filter((x) => !x.date);
      if (loose.length) h += '<h3 class="day">Repris de ta feuille, sans date</h3>' + loose.map((x) => txRow(x, m)).join('');
    }
    return h + '</main>';
  }

  function viewFeuille() {
    const c = cur(), m = M();
    const add = (act, label) => '<button class="addline" data-act="' + act + '">' + ICON.plusSmall + label + '</button>';
    const head = (title, total) => '<div class="fs-head">' + H2(title) + '<span class="fs-total">' + ARROW + '<span class="num">' + C.fmt(total) + '</span></span></div>';
    const restLine = (v, final) => '<div class="restline' + (final ? ' final' : '') + '"><span class="w">Reste</span> <span class="val' + (v < 0 ? ' neg' : '') + '">' +
      (final ? '<span class="box">' + money(v) + '</span>' : money(v)) + '</span></div>';

    let h = '<main>';
    // Salaires
    h += '<section class="fs" style="margin-top:14px">' + head('Salaires', c.incomeTotal);
    m.incomes.forEach((x) => {
      h += '<button class="fl" data-act="editIncome" data-id="' + esc(x.id) + '"><span class="fl-main"><span><span class="fl-lab">' + esc(x.label) + '</span>' + (x.once ? '<span class="sub">Seulement ce mois-ci</span>' : '') + '</span><span class="val">' + money(x.amount) + '</span></span></button>';
    });
    h += add('newIncome', 'Ajouter une rentrée');
    h += '<button class="fl" data-act="editKeep"><span class="fl-main"><span><span class="fl-lab">Reste fin de mois</span><span class="sub">Ce que tu veux garder</span></span><span class="val">' + money(c.keep) + '</span></span></button>';
    h += restLine(c.afterKeep) + '</section>';

    // Prélèvements
    h += '<section class="fs">' + head('Prélèvements', c.fixedTotal);
    m.fixed.forEach((x) => {
      h += '<div class="fl"><button class="tick" data-act="toggleFixed" data-id="' + esc(x.id) + '" aria-pressed="' + (x.done ? 'true' : 'false') + '" aria-label="' + esc(x.label + ', débité') + '"><i>' + ICON.tick + '</i></button>' +
        '<button class="fl-main" data-act="editFixed" data-id="' + esc(x.id) + '"><span class="fl-lab">' + esc(x.label) + (x.done ? ' <span class="debite">ok débité</span>' : '') + '</span><span class="val">' + money(x.amount) + '</span></button></div>';
    });
    h += add('newFixed', 'Ajouter un prélèvement') + restLine(c.afterFixed) + '</section>';

    // Dépenses prévues
    h += '<section class="fs">' + head('Dépenses prévues', c.plannedTotal);
    c.envs.forEach((e) => {
      const bits = [];
      if (e.unit > 0 && e.budget > 0) {
        const n = e.budget / e.unit;
        bits.push((Number.isInteger(n) ? n : String(Math.round(n * 10) / 10).replace('.', ',')) + ' fois ' + unitText(e.unit));
      }
      if (e.occasional) bits.push(e.paused ? 'Selon les mois : pas ce mois-ci' : 'Selon les mois');
      if (e.adj) bits.push((e.adj > 0 ? C.fmt(e.adj) + ' ajoutés' : C.fmt(-e.adj) + ' retirés') + ' ce mois-ci');
      if (e.carry > 0) bits.push('+ ' + C.fmt(e.carry) + ' reportés du mois dernier');
      else if (e.rollover) bits.push('Le reste se reporte');
      h += '<button class="fl' + (e.paused ? ' off' : '') + '" data-act="editEnv" data-id="' + esc(e.id) + '"><span class="fl-main"><span><span class="fl-lab">' + esc(e.label) + '</span>' +
        (bits.length ? '<span class="sub">' + bits.map(esc).join(' &nbsp; ') + '</span>' : '') + '</span><span class="val">' + money(e.paused ? e.budget : e.planned + e.adj) + '</span></span></button>';
    });
    h += add('newEnv', 'Ajouter une enveloppe') + restLine(c.free, true);
    if (c.free > 0) h += '<p class="note">' + E(c.free) + ' ne sont dans aucune enveloppe. Si tu n\'y touches pas, ils s\'ajoutent à ton reste de fin de mois.</p>';
    else if (c.free < 0) h += '<p class="note bad">Tu as prévu ' + E(-c.free) + ' de plus que ce que tu gagnes. Baisse une enveloppe ou ton reste de fin de mois.</p>';
    else if (c.envs.length) h += '<p class="note">Chaque euro a sa place.</p>';
    h += '</section>';

    h += '<div class="btns" style="margin-top:28px">';
    if (c.envs.length > 1 || (c.envs.length === 1 && c.free > 0)) h += '<button class="btn ghost" data-act="move">Déplacer de l\'argent</button>';
    h += '<button class="btn danger" data-act="deleteMonth">Supprimer cette feuille</button></div>';
    return h + '</main>';
  }

  function viewBilan() {
    const c = cur(), m = M(), hist = C.history(calc());
    const line = (label, val, sub, cls) => '<div class="line"><span class="line-l"><span class="line-lab">' + label + '</span>' + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</span><span class="val' + (cls || '') + '">' + val + '</span></div>';
    let h = '<main>' + H2(C.cap(C.monthName(ui.month)) + ' en chiffres') + '<div>';
    h += line('Rentrées', money(c.incomeTotal));
    h += line('Prélèvements', money(c.fixedTotal), c.fixedCount ? plural(c.fixedDoneCount, 'débité', 'débités') + ' sur ' + c.fixedCount : '');
    h += line('Dépensé', money(c.spentTotal), c.count ? 'En ' + plural(c.count, 'dépense', 'dépenses') + ', sur ' + E(c.plannedTotal + c.carryIn) + ' prévus' : 'Rien pour l\'instant');
    if (c.phase === 'past') h += line('Gardé', money(c.kept), c.keep > 0 ? (c.kept >= c.keep ? '<span class="ok">Objectif de ' + E(c.keep) + ' tenu</span>' : '<span class="warn">Objectif de ' + E(c.keep) + ' manqué</span>') : '', c.kept < 0 ? ' neg' : '');
    else h += line('Fin de mois', money(c.endMin), c.endMin >= c.keep ? 'Au minimum, si tu respectes tes enveloppes' : '<span class="warn">Sous ton objectif de ' + E(c.keep) + '</span>', c.endMin < 0 ? ' neg' : '');
    h += '</div>';

    h += H2('Où est parti l\'argent');
    const spent = c.envs.filter((e) => e.spent > 0).sort((a, b) => b.spent - a.spent);
    if (!spent.length) h += '<p class="note">Rien de dépensé pour l\'instant.</p>';
    else {
      const max = spent[0].spent;
      h += '<div>' + spent.map((e) => '<div class="bar"><div class="bar-top"><span class="line-lab">' + esc(e.label) + '</span><span class="val">' + money(e.spent) + '</span></div>' +
        '<div class="bar-track"><i style="width:' + (e.spent / max * 100).toFixed(1) + '%"></i></div><div class="sub">' + Math.round(e.spent / c.spentTotal * 100) + '\u00A0% de tes dépenses, en ' + plural(e.count, 'fois', 'fois') + '</div></div>').join('') + '</div>';
    }

    const big = C.topExpenses(m, 5);
    if (big.length > 1) h += H2('Les plus grosses dépenses') + '<div>' + big.map((x) => txRow(x, m)).join('') + '</div>';

    h += H2('Vérifier avec ma banque') + '<p class="note">D\'après ta feuille, ton compte devrait afficher</p><div class="big">' + money(c.balance) + '</div>' +
      '<p class="sub" style="margin-top:6px">' + (c.startBalance ? E(c.startBalance) + ' au départ, ' : '') + '+ ' + E(c.incomeTotal) + ' de rentrées, \u2212 ' + E(c.fixedDone) + ' de prélèvements débités, \u2212 ' + E(c.spentTotal) + ' de dépenses</p>' +
      '<div class="btns"><button class="btn ghost" data-act="bank">Comparer avec mon compte</button></div>';

    h += H2('Mois après mois');
    if (!hist.rows.length) h += '<p class="note">Tes mois terminés s\'afficheront ici, avec ce que tu as gardé à chaque fois.</p>';
    else {
      h += '<table class="hist"><thead><tr><th scope="col">Mois</th><th scope="col">Dépensé</th><th scope="col">Gardé</th></tr></thead><tbody>' +
        hist.rows.slice().reverse().map((r) => '<tr><td>' + esc(C.monthLabel(r.key)) + '</td><td>' + C.fmt(r.spentTotal) + '</td><td class="' + (r.met ? 'y' : 'n') + '">' + C.fmt(r.kept) + '</td></tr>').join('') + '</tbody></table>';
      h += '<p class="note">' + (hist.streak > 1 ? 'Objectif tenu ' + hist.streak + ' mois de suite. ' : hist.streak === 1 ? 'Objectif tenu le mois dernier. ' : '') +
        (hist.cumul >= 0 ? 'En tout, ' + E(hist.cumul) + ' mis de côté depuis ' + esc(C.monthName(hist.rows[0].key)) + '.' : '') + '</p>';
    }
    return h + '</main>';
  }

  function renderView() {
    const keys = monthKeys();
    let html, bare = false;
    if (!keys.length) { html = viewOnboarding(); bare = true; }
    else if (!state.months[ui.month]) { html = header() + (storageOk ? '' : storageBanner()) + viewPrepare(); bare = true; }
    else {
      const v = ui.tab === 'depenses' ? viewDepenses() : ui.tab === 'feuille' ? viewFeuille() : ui.tab === 'bilan' ? viewBilan() : viewResume();
      html = header() + (storageOk ? '' : storageBanner()) + v + nav();
    }
    $view.className = 'app' + (bare ? ' bare' : '');
    $view.innerHTML = html;
    frenchSpaces($view);
    $toast.classList.toggle('high', bare);
    ui.draw = null;
    screenChanged = true;
  }

  /* ---------- Feuilles qui montent du bas ---------- */

  function shHead(title, extra) {
    return '<div class="sh-hd"><h2 id="sh-title">' + esc(title) + '</h2><div class="acts">' + (extra || '') +
      '<button class="icb" data-act="close" aria-label="Fermer">' + ICON.close + '</button></div></div>';
  }
  const fld = (label, inner, hint) => '<label class="fld"><span>' + label + '</span>' + inner + (hint ? '<small class="hint">' + hint + '</small>' : '') + '</label>';
  const amountInput = (name, value, extra) => '<span class="euro"><input name="' + name + '" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" value="' + esc(value) + '"' + (extra || '') + '></span>';
  const textInput = (name, value, extra) => '<input name="' + name + '" type="text" maxlength="60" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" value="' + esc(value) + '"' + (extra || '') + '>';
  const sw = (name, title, hint, on) => '<label class="sw"><span><span class="sw-t">' + title + '</span>' + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</span><input type="checkbox" name="' + name + '"' + (on ? ' checked' : '') + '></label>';

  const SHEETS = {};

  SHEETS.expense = function (p) {
    const c = cur(), m = M();
    let h = shHead(p.mode === 'edit' ? 'Dépense' : 'Nouvelle dépense', p.mode === 'edit' ? '<button class="icb del" data-act="deleteExpense" aria-label="Supprimer cette dépense">' + ICON.trash + '</button>' : '');
    h += '<div class="x-amt" aria-live="polite"><div class="x-terms" id="x-terms"></div><div class="x-big" id="x-big"></div></div>';
    h += '<div class="chips" role="group" aria-label="Dans quelle enveloppe">' + c.envs.map((e) =>
      '<button class="chip' + (e.paused ? ' paused' : '') + '" data-act="xEnv" data-id="' + esc(e.id) + '" aria-pressed="false">' + esc(e.label) + '</button>').join('') + '</div>';
    h += '<div class="x-info" id="x-info"></div>';
    const k = ui.month, min = k + '-01', max = k + '-' + (C.daysIn(k) < 10 ? '0' : '') + C.daysIn(k);
    h += '<div class="x-nd"><input type="text" id="x-note" maxlength="120" placeholder="Note (facultatif)" aria-label="Note" autocomplete="off" enterkeyhint="done" value="' + esc(p.note) + '">' +
      '<label class="x-date">' + ICON.cal + '<span id="x-date-l"></span><input type="date" id="x-date" aria-label="Date de la dépense" min="' + min + '" max="' + max + '" value="' + esc(p.date || '') + '"></label></div>';
    const key = (k2, label, cls, aria) => '<button class="key' + (cls ? ' ' + cls : '') + '" data-act="xKey" data-k="' + k2 + '"' + (aria ? ' aria-label="' + aria + '"' : '') + '>' + label + '</button>';
    h += '<div class="pad">' + key('1', '1') + key('2', '2') + key('3', '3') + key('back', ICON.back, 'fn', 'Effacer') +
      key('4', '4') + key('5', '5') + key('6', '6') +
      (p.mode === 'add' ? key('+', ICON.padPlus, 'fn', 'Ajouter un autre montant') : '<span></span>') +
      key('7', '7') + key('8', '8') + key('9', '9') +
      '<button class="key go" id="x-go" data-act="xGo"></button>' +
      key('0', '0', 'wide') + key(',', ',', '', 'Virgule') + '</div>';
    if (!m.envelopes.length) h += '<p class="err">Ajoute d\'abord une enveloppe dans ta feuille.</p>';
    return h;
  };

  function xTotal(p) { return sumOf(p.terms) + (C.parseAmount(p.entry) || 0); }

  function updateExpenseSheet() {
    const p = top();
    if (!p || p.type !== 'expense') return;
    const c = cur(), t = today();
    const total = xTotal(p), entryVal = C.parseAmount(p.entry) || 0;
    const big = document.getElementById('x-big');
    if (!big) return;
    big.className = 'x-big' + (p.entry ? '' : ' empty');
    big.innerHTML = esc(p.entry || '0,00') + '<small>€</small>';
    document.getElementById('x-terms').textContent = p.terms.length ? p.terms.map((a) => C.fmt(a)).join(' + ') + ' +' : '';
    $sheet.querySelectorAll('.chip[data-act="xEnv"]').forEach((el) => el.setAttribute('aria-pressed', el.getAttribute('data-id') === p.env ? 'true' : 'false'));
    const info = document.getElementById('x-info');
    const e = p.env ? c.byId[p.env] : null;
    let ih = '';
    if (e && total > 0) {
      const after = e.rest - total + (p.mode === 'edit' && p.origEnv === e.id ? p.origAmount : 0);
      const n = p.terms.length + (entryVal > 0 ? 1 : 0);
      ih = (n > 1 ? n + ' dépenses, ' + E(total) + ' en tout. ' : '') +
        (after >= 0 ? 'Reste après : <b>' + E(after) + '</b>' : '<span class="warn">Dépasse de ' + E(-after) + '</span>');
    } else if (e) {
      const quick = p.mode === 'add' ? C.quickAmounts(state, ui.month, e.id) : [];
      ih = quick.length ? '<span>Souvent :</span>' + quick.map((a) => '<button class="chip" data-act="xQuick" data-a="' + a + '">' + C.fmt(a) + '</button>').join('') : 'Reste : <b>' + E(e.rest) + '</b>';
    } else if (total > 0) {
      ih = 'Choisis l\'enveloppe.';
    } else {
      ih = 'Tape le montant, puis choisis l\'enveloppe.';
    }
    info.innerHTML = ih;
    frenchSpaces(info);
    document.getElementById('x-date-l').textContent = p.date ? C.shortDate(p.date, t) : 'Sans date';
    const go = document.getElementById('x-go');
    const n2 = p.terms.length + (entryVal > 0 ? 1 : 0);
    go.textContent = p.mode === 'edit' ? 'OK' : (n2 > 1 ? 'Noter les ' + n2 : 'Noter');
    go.disabled = !(total > 0 && e);
  }

  function xKey(k) {
    const p = top();
    if (!p || p.type !== 'expense') return;
    if (k === 'back') {
      p.fresh = false;
      if (p.entry) p.entry = p.entry.slice(0, -1);
      else if (p.terms.length) p.entry = C.fmtInput(p.terms.pop());
    } else if (k === '+') {
      const v = C.parseAmount(p.entry);
      if (p.mode === 'add' && v > 0 && p.terms.length < 30) { p.terms.push(v); p.entry = ''; p.fresh = false; }
    } else {
      if (p.fresh) { p.entry = ''; p.fresh = false; }
      if (k === ',') {
        if (p.entry.indexOf(',') === -1) p.entry = (p.entry || '0') + ',';
      } else if (/^[0-9]$/.test(k)) {
        const parts = p.entry.split(',');
        if (parts.length === 2) { if (parts[1].length >= 2) return; }
        else if (parts[0].length >= 6) return;
        p.entry = p.entry === '0' ? k : p.entry + k;
      }
    }
    updateExpenseSheet();
  }

  function xGo() {
    const p = top();
    if (!p || p.type !== 'expense') return;
    const m = M(), env = C.findById(m.envelopes, p.env);
    const last = C.parseAmount(p.entry) || 0;
    const amounts = p.terms.concat(last > 0 ? [last] : []);
    if (!env || !amounts.length) return;
    const note = (p.note || '').replace(/\s+/g, ' ').trim().slice(0, 120);
    if (p.mode === 'edit' && !C.findById(m.expenses, p.id)) { closeSheet(); return; }
    snap();
    if (env.paused) env.paused = false; // une dépense dans une enveloppe en pause : c'est qu'on en a besoin ce mois-ci
    if (p.mode === 'edit') {
      const x = C.findById(m.expenses, p.id);
      x.amount = amounts[0]; x.envelope = env.id; x.note = note; x.date = p.date || null;
      ui.modals.pop();
      ui.draw = env.id;
      commit();
      if (!top()) hideSheet();
      toast('Dépense modifiée', true);
    } else {
      amounts.forEach((a) => m.expenses.push({ id: C.uid(), envelope: env.id, amount: a, date: p.date || null, note: note }));
      ui.modals = [];
      ui.draw = env.id;
      commit();
      hideSheet();
      toast(amounts.length > 1 ? amounts.length + ' dépenses notées dans ' + env.label : E(amounts[0]) + ' ' + (amounts[0] >= 200 ? 'notés' : 'noté') + ' dans ' + env.label, true);
    }
  }

  SHEETS.envelope = function (p) {
    const c = cur(), m = M(), e = c.byId[p.id];
    if (!e) return shHead('Enveloppe') + '<p class="txt">Cette enveloppe n\'existe plus.</p>';
    let h = shHead(e.label);
    h += '<div class="e-rest"><span class="w">Reste</span> ' + restAmt(e) + '</div>';
    if (e.rest < 0) {
      h += '<div class="alert">Dépassé de ' + E(-e.rest) + '. Tant que ce n\'est pas couvert, c\'est ton reste de fin de mois qui paie.' +
        (c.envs.some((o) => o.id !== e.id && o.rest > 0) || c.free > 0 ? '<button class="btn" data-act="cover" data-id="' + esc(e.id) + '">Couvrir avec une autre enveloppe</button>' : '') + '</div>';
    }
    const tips = [];
    if (c.phase === 'current' && e.rest > 0 && c.daysLeft > 1) tips.push('Pour tenir jusqu\'au ' + esc(C.lastDayLabel(ui.month)) + ' : <b>' + E(Math.floor(e.rest / c.daysLeft)) + ' par jour</b>.');
    const t = C.times(e.rest, e.unit);
    if (t) tips.push('De quoi faire <b>' + t + ' fois ' + unitText(e.unit) + '</b>.');
    if (e.emptyDay) tips.push('À ton rythme depuis le début du mois, elle sera vide <b>vers le ' + e.emptyDay + ' ' + esc(C.monthName(ui.month)) + '</b>.');
    if (tips.length) h += '<p class="tip">' + tips.join(' ') + '</p>';
    h += '<div class="facts">';
    const fact = (l, v) => '<div class="line"><span class="line-lab">' + l + '</span><span class="val">' + v + '</span></div>';
    h += fact(e.paused ? 'Prévu (en pause ce mois-ci)' : 'Prévu ce mois-ci', money(e.planned));
    if (e.adj) h += fact('Argent déplacé', '<span class="num">' + C.fmt(e.adj, { plus: true }) + '<small>€</small></span>');
    if (e.carry) h += fact('Reporté du mois dernier', '<span class="num">' + C.fmt(e.carry, { plus: true }) + '<small>€</small></span>');
    h += fact('Dépensé' + (e.count ? ', en ' + plural(e.count, 'fois', 'fois') : ''), money(e.spent));
    h += '</div>';
    h += '<h3 class="h3">Dépenses déjà effectuées</h3>' + additionLine(e, m, true);
    const moves = m.moves.filter((x) => x.from === e.id || x.to === e.id);
    if (moves.length) {
      h += '<h3 class="h3">Argent déplacé</h3>';
      moves.forEach((x) => {
        const other = x.to === e.id ? x.from : x.to, o = other ? C.findById(m.envelopes, other) : null;
        const txt = x.to === e.id ? '+ ' + E(x.amount) + ' venus de ' + (o ? o.label : 'ce qui n\'était pas attribué') : '\u2212 ' + E(x.amount) + ' partis vers ' + (o ? o.label : 'le reste non attribué');
        h += '<div class="mv"><span>' + esc(txt) + '</span><button data-act="deleteMove" data-id="' + esc(x.id) + '">Annuler</button></div>';
      });
    }
    h += '<div class="btns"><button class="btn" data-act="add" data-env="' + esc(e.id) + '">Noter une dépense ici</button></div>' +
      '<div class="btns two" style="margin-top:10px"><button class="btn ghost" data-act="move" data-to="' + esc(e.id) + '">Déplacer de l\'argent</button>' +
      '<button class="btn ghost" data-act="editEnv" data-id="' + esc(e.id) + '">Modifier</button></div>';
    return h;
  };

  SHEETS.editEnv = function (p) {
    const m = M(), e = p.id ? C.findById(m.envelopes, p.id) : null, i = e ? m.envelopes.indexOf(e) : -1;
    let h = shHead(e ? 'Enveloppe' : 'Nouvelle enveloppe', e ? '<button class="icb del" data-act="deleteEnv" data-id="' + esc(e.id) + '" aria-label="Supprimer cette enveloppe">' + ICON.trash + '</button>' : '');
    // "draft" : ce qui était tapé mais pas encore enregistré quand la feuille a dû être redessinée (Monter / Descendre)
    const d = p.draft || { label: e ? e.label : '', budget: e ? C.fmtInput(e.budget) : '', unit: e && e.unit ? C.fmtInput(e.unit) : '', occasional: !!(e && e.occasional), paused: !!(e && e.paused), rollover: !!(e && e.rollover) };
    h += '<form data-form="env" novalidate>' +
      fld('Nom', textInput('label', d.label, ' placeholder="Ex. Courses"')) +
      fld('Budget pour le mois', amountInput('budget', d.budget, ' placeholder="0,00"')) +
      fld('Achat habituel (facultatif)', amountInput('unit', d.unit, ' placeholder="Ex. 60,00 pour un plein"'), 'L\'appli te dira combien de fois il t\'en reste, et te proposera ce montant en un geste.') +
      '<div style="margin-top:8px">' +
      sw('occasional', 'Selon les mois', 'Pas besoin tous les mois : je te poserai la question à chaque nouvelle feuille.', d.occasional) +
      sw('paused', 'En pause ce mois-ci', 'Son budget n\'est pas compté ce mois-ci.', d.occasional && d.paused).replace('<label class="sw">', '<label class="sw"' + (d.occasional ? '' : ' hidden') + '>') +
      sw('rollover', 'Reporter le reste', 'Ce qui n\'est pas dépensé s\'ajoute au mois suivant (une cagnotte). Un dépassement, lui, ne se reporte pas.', d.rollover) +
      '</div><p class="err" role="alert"></p><div class="btns"><button class="btn" type="submit">' + (e ? 'Enregistrer' : 'Ajouter l\'enveloppe') + '</button></div></form>';

      h += '<p class="hint" style="margin-top:18px">Place dans la liste</p><div class="btns two" style="margin-top:6px"><button class="btn ghost" data-act="orderEnv" data-id="' + esc(e.id) + '" data-d="-1"' + (i === 0 ? ' disabled' : '') + '>Monter</button>' +
        '<button class="btn ghost" data-act="orderEnv" data-id="' + esc(e.id) + '" data-d="1"' + (i === m.envelopes.length - 1 ? ' disabled' : '') + '>Descendre</button></div>';
    }
    return h;
  };

  SHEETS.editFixed = function (p) {
    const x = p.id ? C.findById(M().fixed, p.id) : null;
    return shHead(x ? 'Prélèvement' : 'Nouveau prélèvement', x ? '<button class="icb del" data-act="deleteFixed" data-id="' + esc(x.id) + '" aria-label="Supprimer ce prélèvement">' + ICON.trash + '</button>' : '') +
      '<form data-form="fixed" novalidate>' + fld('Nom', textInput('label', x ? x.label : '', ' placeholder="Ex. Forfait téléphone"')) +
      fld('Montant par mois', amountInput('amount', x ? C.fmtInput(x.amount) : '', ' placeholder="0,00"')) +
      '<div style="margin-top:8px">' + sw('done', 'Déjà débité ce mois-ci', '', x && x.done) + '</div>' +
      '<p class="err" role="alert"></p><div class="btns"><button class="btn" type="submit">' + (x ? 'Enregistrer' : 'Ajouter le prélèvement') + '</button></div></form>';
  };

  SHEETS.editIncome = function (p) {
    const x = p.id ? C.findById(M().incomes, p.id) : null;
    return shHead(x ? 'Rentrée' : 'Nouvelle rentrée', x ? '<button class="icb del" data-act="deleteIncome" data-id="' + esc(x.id) + '" aria-label="Supprimer cette rentrée">' + ICON.trash + '</button>' : '') +

  SHEETS.editKeep = function () {

  SHEETS.months = function () {

    if (next > t) h += '<button class="btn ghost" data-act="goMonth" data-k="' + next + '">Préparer ' + esc(C.monthName(next)) + ' à l\'avance</button>';
    h += '</div><div style="margin-top:10px">';
    keys.forEach((k) => {
      const c = a[k];

        (c.phase === 'past' ? E(c.spentTotal) + ' dépensés, ' + E(c.kept) + ' gardés' : c.phase === 'current' ? E(c.spentTotal) + ' dépensés pour l\'instant' : 'Préparé à l\'avance') +
        '</span></span>' + (c.phase === 'current' ? '<span class="cur">en cours</span>' : '') + '</button>';

  SHEETS.settings = function () {

    return shHead('Réglages') +
      '<h3 class="h3">Sauvegarde</h3><p class="txt">Tes chiffres sont enregistrés sur cet appareil, nulle part ailleurs. Garde une copie de temps en temps : elle sert aussi à passer sur un autre appareil.</p>' +
      '<p class="hint">Dernière sauvegarde : ' + (last && C.isYmd(last) ? esc(C.dayLabel(last, today()).toLowerCase()) : 'jamais') + '</p>' + homeScreenTip(false) +
      '<div class="btns"><button class="btn" data-act="exportFile">Enregistrer un fichier de sauvegarde</button>' +
      '<button class="btn ghost" data-act="copyCode">Copier le code de sauvegarde</button>' +
      '<button class="btn ghost" data-act="import">Importer une sauvegarde</button></div>' +
      '<h3 class="h3">Apparence</h3><div class="seg" role="group" aria-label="Thème" style="margin-top:10px">' + seg('auto', 'Comme le téléphone') + seg('light', 'Clair') + seg('dark', 'Sombre') + '</div>' +
      '<h3 class="h3">Repartir de zéro</h3><div class="btns" style="margin-top:6px"><button class="btn danger" data-act="reset">Effacer toutes mes données</button></div>' +
      '<p class="hint" style="margin-top:14px">Reste, version ' + APP_VERSION + '</p>';

  SHEETS.import = function () {
    const has = monthKeys().length > 0;
    return shHead(has ? 'Importer une sauvegarde' : 'Importer ma feuille') +
      (has ? '<p class="banner bad">L\'import remplace tout ce qui est enregistré sur cet appareil.</p>' : '') +
      '<p class="txt">Copie ta feuille (le texte qui commence par « Feuille Reste ») ou ton code de sauvegarde, puis touche Coller.</p>' +
      '<div class="btns"><button class="btn" data-act="pasteImport">Coller</button></div>' +
      '<form data-form="importText" novalidate>' + fld('Ou colle le texte dans ce cadre', '<textarea name="code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Feuille Reste : …"></textarea>') +
      '<p class="err" role="alert" id="imp-err"></p><div class="btns"><button class="btn ghost" type="submit">Importer ce texte</button>' +
      '<button class="btn plain" type="button" data-act="pickFile">Choisir un fichier de sauvegarde</button></div></form>' +
      '<input type="file" id="imp-file" accept=".json,.txt,application/json,text/plain" hidden>';
  };

  SHEETS.confirm = function (p) {
    return shHead(p.title) + '<p class="txt">' + esc(p.body) + '</p><div class="btns">' +
      '<button class="btn' + (p.danger ? ' danger' : '') + '" data-act="confirmYes">' + esc(p.yes) + '</button><button class="btn ghost" data-act="close">Annuler</button></div>';
  };

  function confirmSheet(title, body, yes, danger, fn) {
    pendingConfirm = fn;
    openSheet({ type: 'confirm', title: title, body: body, yes: yes, danger: danger });
  }

  function renderSheet(animate) {
    const p = top();
    $toast.classList.toggle('up', !!p);
    if (!p) { $sheet.innerHTML = ''; document.documentElement.classList.remove('locked'); return; }
    // une feuille qui parle d'un mois n'a pas de sens si ce mois n'existe plus
    if (!M() && !/^(months|settings|import|confirm)$/.test(p.type)) { ui.modals = []; pendingConfirm = null; hideSheet(); return; }
    screenChanged = true;
    // on garde la position de défilement quand la même feuille est simplement redessinée
    const old = $sheet.querySelector('.sh');
    const keepScroll = !animate && old && old.getAttribute('data-type') === p.type ? old.scrollTop : 0;
    $sheet.innerHTML = '<div class="ov' + (animate ? '' : ' in') + '" data-act="closeBg"><div class="sh" data-type="' + p.type + '" role="dialog" aria-modal="true" aria-labelledby="sh-title" tabindex="-1">' + SHEETS[p.type](p) + '</div></div>';
    document.documentElement.classList.add('locked');
    if (p.type === 'expense') updateExpenseSheet();
    frenchSpaces($sheet);
    const ov = $sheet.firstChild;
    if (keepScroll) ov.firstChild.scrollTop = keepScroll;
    if (animate) requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('in')));
    if (animate) {
      const sh = ov.firstChild;
      const first = p.focus ? sh.querySelector(p.focus) : null;
      try { (first || sh).focus({ preventScroll: true }); } catch (e) { /* vieux navigateurs */ }
    }
  }

  // Bouton Retour (Android) ou balayage arrière (Safari) : ça ferme la feuille au lieu de quitter l'appli.
  // Une seule étape d'historique est ajoutée, puis réutilisée d'une feuille à l'autre : l'appli ne recule
  // jamais d'elle-même dans l'historique, il n'y a donc rien à synchroniser.
  let histSpare = false;
  function histPush() {
    if (histSpare) return;
    try { history.pushState({ resteSheet: true }, ''); histSpare = true; } catch (e) { /* historique indisponible */ }
  }
  window.addEventListener('popstate', () => {
    histSpare = false;
    if (!ui.modals.length) return;
    ui.modals = [];
    pendingConfirm = null;
    hideSheet();
  });

  function openSheet(p) {
    if (!ui.modals.length) lastFocus = document.activeElement;
    hideToast(); // on passe à autre chose : l'ancien message n'a plus sa place
    ui.modals.push(p);
    histPush();
    renderSheet(true);
  }
  function hideSheet() {
    if ($sheet.firstChild) screenChanged = true;
    $sheet.innerHTML = '';
    $toast.classList.remove('up');
    document.documentElement.classList.remove('locked');
    if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
    lastFocus = null;
    if (!ui.modals.length) syncDay(false); // si minuit est passé pendant que la feuille était ouverte
  }
  function closeSheet() {
    const gone = ui.modals.pop();
    if (gone && gone.type === 'confirm') pendingConfirm = null;
    if (top()) renderSheet(false);
    else hideSheet();
  }
  function closeAll() { ui.modals = []; hideSheet(); }

  function toast(msg, withUndo) {
    clearTimeout(toastTimer); clearTimeout(toastClear);
    $toast.innerHTML = '<span>' + esc(msg) + '</span>' + (withUndo && undoSnap ? '<button data-act="undo">Annuler</button>' : '');
    frenchSpaces($toast);
    $toast.classList.add('in');
    screenChanged = true;
    toastTimer = setTimeout(hideToast, withUndo ? 7000 : 2600);
  }
  let toastClear = null;
  function hideToast() {
    clearTimeout(toastTimer); clearTimeout(toastClear);
    if (!$toast.classList.contains('in') && !$toast.firstChild) return;
    $toast.classList.remove('in');
    // une fois effacé de l'écran, son bouton ne doit plus pouvoir être atteint (clavier, lecteur d'écran)
    toastClear = setTimeout(() => { if (!$toast.classList.contains('in')) $toast.innerHTML = ''; }, 220);
  }

  /* ---------- Sauvegarde : fichier, code, import ---------- */

  function exportFile() {
    const name = 'reste-sauvegarde-' + today() + '.json';
    const text = C.toFileText(state);
    const done = () => { state.meta.lastBackupAt = today(); save(); renderView(); if (top()) renderSheet(false); toast('Fichier de sauvegarde prêt'); };
    const download = () => {
      const a = document.createElement('a');
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      done();
    };
    try {
      const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      if (touch && navigator.canShare) {
        const types = ['application/json', 'text/plain'];
        for (let i = 0; i < types.length; i++) {
          const file = new File([text], name, { type: types[i] });
          if (navigator.canShare({ files: [file] })) {
            // fermer le partage sans rien choisir n'est pas une erreur ; tout autre refus bascule sur le téléchargement
            navigator.share({ files: [file], title: 'Sauvegarde Reste' }).then(done, (err) => { if (!err || err.name !== 'AbortError') download(); });
            return;
          }
        }
      }
    } catch (e) { /* on passe au téléchargement classique */ }
    download();
  }

  function copyCode() {
    const code = C.toCode(state);
    const ok = () => { state.meta.lastBackupAt = today(); save(); renderView(); if (top()) renderSheet(false); toast('Code copié : colle-le dans tes notes ou un message à toi-même'); };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = code; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, code.length);
      let good = false;
      try { good = document.execCommand('copy'); } catch (e) { good = false; }
      ta.remove();
      if (good) ok(); else toast('Copie impossible ici : utilise plutôt le fichier de sauvegarde');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, fallback);
    else fallback();
  }

  // Le message sous le cadre d'import. Sur un petit écran il peut être hors de vue : on l'y amène.
  function impErr(msg) {
    const err = document.getElementById('imp-err');
    if (!err) return;
    err.textContent = msg;
    if (msg) { try { err.scrollIntoView({ block: 'nearest' }); } catch (e) { /* vieux navigateurs */ } }
  }

  // late : l'import arrive après coup (réponse du presse-papiers, fichier lu). L'écran va alors changer sans qu'on
  // l'ait touché à cet instant : un appui déjà parti ne doit rien valider sur l'écran suivant.
  function importText(text, late) {
    let next;
    try { next = C.fromText(text); }
    catch (e) { impErr(e.message); return; }
    const n = Object.keys(next.months).length;
    if (!n) { impErr('Cette sauvegarde est vide.'); return; }
    // une feuille tapée ne contient qu'un mois : le message dit lequel, et combien de dépenses elle apporte
    const sheetKey = C.isSheetText(text) ? Object.keys(next.months)[0] : null;
    const count = sheetKey ? next.months[sheetKey].expenses.length : 0;
    const sheetName = sheetKey ? C.de(C.monthName(sheetKey)) + (sheetKey.slice(0, 4) !== today().slice(0, 4) ? ' ' + sheetKey.slice(0, 4) : '') : '';
    const doneMsg = sheetKey
      ? 'Feuille ' + sheetName + ' importée' + (count ? ' : ' + plural(count, 'dépense', 'dépenses') : '')
      : 'Sauvegarde importée : ' + plural(n, 'mois', 'mois');
    const apply = () => {
      snap();
      if (sheetKey) next.settings.theme = state.settings.theme; // une feuille ne dit rien de l'apparence : on garde celle choisie
      state = next;
      state.meta.lastBackupAt = today(); // ce qu'on vient d'importer est déjà une sauvegarde
      ui.modals = [];
      // une feuille tapée s'ouvre sur son mois, même si ce n'est pas le mois en cours : on voit ce qu'on vient d'importer
      ui.month = sheetKey || pickMonth(); ui.tab = 'resume'; ui.draw = 'all';
      applyTheme();
      commit();
      hideSheet();
      window.scrollTo(0, 0);
      toast(doneMsg, monthKeysOf(undoSnap) > 0);
    };
    if (late) armGuard();
    if (monthKeys().length) {
      const body = sheetKey
        ? 'Tout ce qui est enregistré sur cet appareil (' + plural(monthKeys().length, 'mois', 'mois') + ') sera remplacé par la seule feuille ' + C.de(C.monthName(sheetKey)) + ' ' + sheetKey.slice(0, 4) + '.'
        : 'Tout ce qui est enregistré sur cet appareil sera remplacé par la sauvegarde (' + plural(n, 'mois', 'mois') + ').';
      confirmSheet('Remplacer mes données ?', body, 'Remplacer', true, apply);
    } else apply();
  }
  function monthKeysOf(json) { try { return Object.keys(JSON.parse(json).months).length; } catch (e) { return 0; } }

  /* ---------- Formulaires ---------- */

  const FORMS = {};
  const val = (f, n) => (f.elements[n] ? f.elements[n].value : '');
  const checked = (f, n) => !!(f.elements[n] && f.elements[n].checked);
  function fail(f, msg, name) {
    const err = f.querySelector('.err');
    if (err) err.textContent = msg;
    if (name && f.elements[name]) f.elements[name].focus();
    return false;
  }
  function needLabel(f) {
    const label = val(f, 'label').replace(/\s+/g, ' ').trim().slice(0, 60);
    if (!label) { fail(f, 'Donne-lui un nom.', 'label'); return null; }
    return label;
  }
  function needAmount(f, name, allowZero) {
    const a = C.parseAmount(val(f, name));
    if (a === null) { fail(f, 'Écris un montant comme 12,50 (au plus 999 999,99).', name); return null; }
    if (a === 0 && !allowZero) { fail(f, 'Le montant doit être plus grand que zéro.', name); return null; }
    return a;
  }

  FORMS.env = function (f) {
    const p = top(), m = M();
    const label = needLabel(f); if (label === null) return;
    const budget = needAmount(f, 'budget', true); if (budget === null) return;
    let unit = 0;
    if (val(f, 'unit').trim()) {
      unit = C.parseAmount(val(f, 'unit'));
      if (unit === null) return fail(f, 'L\'achat habituel doit être un montant, par exemple 60.', 'unit');
    }
    snap();
    let e = p.id ? C.findById(m.envelopes, p.id) : null;
    if (!e) { e = { id: C.uid(), paused: false }; m.envelopes.push(e); }
    e.label = label; e.budget = budget; e.unit = unit;
    e.occasional = checked(f, 'occasional');
    e.rollover = checked(f, 'rollover');
    e.paused = e.occasional && checked(f, 'paused');
    ui.modals.pop();
    commit();
    if (!top()) hideSheet();
    toast(p.id ? 'Enveloppe modifiée' : 'Enveloppe ajoutée', true);
  };

  FORMS.fixed = function (f) {
    const p = top(), m = M();
    const label = needLabel(f); if (label === null) return;
    const amount = needAmount(f, 'amount'); if (amount === null) return;
    snap();
    let x = p.id ? C.findById(m.fixed, p.id) : null;
    if (!x) { x = { id: C.uid() }; m.fixed.push(x); }
    x.label = label; x.amount = amount; x.done = checked(f, 'done');
    closeAll(); commit();
    toast(p.id ? 'Prélèvement modifié' : 'Prélèvement ajouté', true);
  };

  FORMS.income = function (f) {
    const p = top(), m = M();
    const label = needLabel(f); if (label === null) return;
    const amount = needAmount(f, 'amount'); if (amount === null) return;
    snap();
    let x = p.id ? C.findById(m.incomes, p.id) : null;
    if (!x) { x = { id: C.uid() }; m.incomes.push(x); }
    x.label = label; x.amount = amount; x.once = checked(f, 'once');
    closeAll(); commit();
    toast(p.id ? 'Rentrée modifiée' : 'Rentrée ajoutée', true);
  };

  FORMS.keep = function (f) {
    const a = needAmount(f, 'keep', true); if (a === null) return;
    snap();
    M().keep = a;
    closeAll(); commit();
    toast('Reste fin de mois : ' + E(a), true);
  };

  FORMS.move = function (f) {
    const c = cur(), m = M();
    const from = val(f, 'from') || null, to = val(f, 'to') || null;
    if (from === to) return fail(f, 'Choisis deux endroits différents.', 'to');
    const amount = needAmount(f, 'amount'); if (amount === null) return;
    const room = from ? (c.byId[from] ? c.byId[from].rest : 0) : c.free;
    if (amount > room) return fail(f, 'Il n\'y a que ' + E(Math.max(0, room)) + ' à prendre ici.', 'amount');
    snap();
    m.moves.push({ id: C.uid(), from: from, to: to, amount: amount, date: today() });
    const dest = to ? C.findById(m.envelopes, to).label : 'ce qui n\'est pas attribué';
    ui.modals.pop();
    if (to) ui.draw = to;
    commit();
    if (!top()) hideSheet();
    toast(E(amount) + ' déplacés vers ' + dest, true);
  };

  FORMS.bank = function (f) {
    let a = C.parseAmount(val(f, 'actual'), true);
    if (a === null) return fail(f, 'Écris le solde affiché par ta banque, par exemple 432,10.', 'actual');
    if (checked(f, 'neg') && a > 0) a = -a;
    top().actual = a;
    renderSheet(false);
  };

  FORMS.importText = function (f) { importText(val(f, 'code')); };

  /* ---------- Actions ---------- */

  function defaultDate() {
    const t = today(), k = ui.month;
    if (t.slice(0, 7) === k) return t;
    return k < t.slice(0, 7) ? k + '-' + C.daysIn(k) : k + '-01';
  }

  const ACT = {
    tab(el) {
      ui.modals = []; hideSheet();
      ui.tab = el.getAttribute('data-tab');
      renderView();
      window.scrollTo(0, 0);
    },
    add(el) {
      if (!M() || !M().envelopes.length) { ui.tab = 'feuille'; closeAll(); renderView(); toast('Ajoute d\'abord une enveloppe'); return; }
      openSheet({ type: 'expense', mode: 'add', env: el.getAttribute('data-env') || null, entry: el.getAttribute('data-amount') || '', fresh: false, terms: [], note: '', date: defaultDate() });
    },
    env(el) { openSheet({ type: 'envelope', id: el.getAttribute('data-id') }); },
    editExpense(el) {
      const x = C.findById(M().expenses, el.getAttribute('data-id'));
      if (!x) return;
      openSheet({ type: 'expense', mode: 'edit', id: x.id, env: x.envelope, origEnv: x.envelope, origAmount: x.amount, entry: C.fmtInput(x.amount), fresh: true, terms: [], note: x.note, date: x.date });
    },
    deleteExpense() {
      const p = top(), m = M();
      if (!p || !p.id) return;
      snap();
      m.expenses = m.expenses.filter((x) => x.id !== p.id);
      ui.modals.pop();
      commit();
      if (!top()) hideSheet();
      toast('Dépense supprimée', true);
    },
    xKey(el) { xKey(el.getAttribute('data-k')); },
    xEnv(el) { const p = top(); p.env = el.getAttribute('data-id'); updateExpenseSheet(); },
    xQuick(el) { const p = top(); p.entry = C.fmtInput(+el.getAttribute('data-a')); p.fresh = true; updateExpenseSheet(); },
    xGo() { xGo(); },
    close() { closeSheet(); },
    closeBg(el, ev) { if (ev.target === el && pressedOnBackdrop) closeSheet(); },
    undo() { undo(); },
    months() { openSheet({ type: 'months' }); },
    goMonth(el) {
      ui.month = el.getAttribute('data-k');
      ui.tab = 'resume'; ui.draw = 'all';
      closeAll(); renderView(); window.scrollTo(0, 0);
    },
    createMonth(el) {
      const src = state.months[el.getAttribute('data-src')];
      if (!src || state.months[ui.month]) return;
      const paused = Object.create(null);
      $view.querySelectorAll('input[data-occ]').forEach((i) => { if (!i.checked) paused[i.getAttribute('data-occ')] = true; });
      snap();
      state.months[ui.month] = C.monthFrom(src, paused);
      ui.tab = 'feuille'; ui.draw = 'all';
      commit(); window.scrollTo(0, 0);
      toast('Feuille ' + C.de(C.monthName(ui.month)) + ' prête : vérifie les montants', true);
    },
    createEmpty() {
      if (state.months[ui.month]) return;
      snap();
      state.months[ui.month] = C.emptyMonth();
      ui.tab = 'feuille';
      commit(); window.scrollTo(0, 0);
      toast('Feuille vide prête', true);
    },
    startEmpty() {
      ui.month = today().slice(0, 7);
      state.months[ui.month] = C.emptyMonth();
      ui.tab = 'feuille';
      commit(); window.scrollTo(0, 0);
    },
    deleteMonth() {
      const key = ui.month, label = C.monthLabel(key), n = M().expenses.length;
      confirmSheet('Supprimer cette feuille ?', 'La feuille ' + C.de(C.monthName(key)) + ' ' + key.slice(0, 4) + (n ? ' et ' + itsExpenses(n) + ' seront effacées.' : ' sera effacée.'), 'Supprimer ' + label.toLowerCase(), true, () => {
        if (!state.months[key]) return;
        snap();
        delete state.months[key]; // le mois nommé dans la confirmation, quoi qu'il se soit passé entre-temps
        ui.month = pickMonth(); ui.tab = 'resume'; ui.draw = 'all';
        closeAll(); commit(); window.scrollTo(0, 0);
        toast('Feuille supprimée', true);
      });
    },
    settings() { openSheet({ type: 'settings' }); },
    theme(el) { state.settings.theme = el.getAttribute('data-v'); applyTheme(); commit(); },
    exportFile() { exportFile(); },
    copyCode() { copyCode(); },
    import() { openSheet({ type: 'import' }); },
    pickFile() { const i = document.getElementById('imp-file'); if (i) i.click(); },
    // « Coller » : lit le presse-papiers et importe aussitôt. Si l'appareil refuse la lecture, on guide vers le cadre de texte.
    pasteImport() {
      const p = top(); // la feuille d'import telle qu'elle est ouverte à cet instant
      const box = () => $sheet.querySelector('textarea[name="code"]');
      const typed = box() ? box().value : '';
      // la réponse du presse-papiers peut arriver tard : elle ne vaut que si rien n'a bougé entre-temps
      const stale = () => top() !== p || (box() && box().value !== typed);
      const byHand = () => {
        if (stale()) return;
        impErr('Lecture du presse-papiers refusée. Colle le texte dans le cadre (appui long, puis « Coller »), puis touche « Importer ce texte ».');
        try { box().focus(); } catch (e) { /* rien */ }
      };
      impErr('');
      if (!navigator.clipboard || !navigator.clipboard.readText) { byHand(); return; }
      let asked;
      try { asked = navigator.clipboard.readText(); } catch (e) { byHand(); return; }
      asked.then((text) => {
        if (stale()) return;
        if (typeof text !== 'string' || !text.trim()) { impErr('Le presse-papiers est vide : copie d\'abord ta feuille ou ton code.'); return; }
        if (box()) box().value = text;
        importText(text, true);
      }, byHand);
    },
    reset() {
      confirmSheet('Tout effacer ?', 'Toutes tes feuilles et toutes tes dépenses seront supprimées de cet appareil. Fais une sauvegarde avant si tu veux pouvoir revenir en arrière.', 'Tout effacer', true, () => {
        snap();
        const theme = state.settings.theme;
        state = C.emptyState(); state.settings.theme = theme;
        ui.month = null; ui.tab = 'resume';
        closeAll(); commit(); window.scrollTo(0, 0);
        toast('Tout est effacé', true);
      });
    },
    confirmYes() {
      const fn = pendingConfirm;
      pendingConfirm = null;
      ui.modals.pop();
      if (fn) fn();
      if (top()) renderSheet(false); else hideSheet();
    },
    txView(el) { ui.txView = el.getAttribute('data-v'); renderView(); },
    toggleFixed(el) {
      const x = C.findById(M().fixed, el.getAttribute('data-id'));
      if (!x) return;
      x.done = !x.done;
      commit();
    },
    editFixed(el) { openSheet({ type: 'editFixed', id: el.getAttribute('data-id'), focus: null }); },
    newFixed() { openSheet({ type: 'editFixed', id: null, focus: 'input[name="label"]' }); },
    editIncome(el) { openSheet({ type: 'editIncome', id: el.getAttribute('data-id') }); },
    newIncome() { openSheet({ type: 'editIncome', id: null, focus: 'input[name="label"]' }); },
    editKeep() { openSheet({ type: 'editKeep' }); },
    editEnv(el) { openSheet({ type: 'editEnv', id: el.getAttribute('data-id') }); },
    newEnv() { openSheet({ type: 'editEnv', id: null, focus: 'input[name="label"]' }); },
    orderEnv(el) {
      const m = M(), e = C.findById(m.envelopes, el.getAttribute('data-id')), d = +el.getAttribute('data-d');
      const i = m.envelopes.indexOf(e), j = i + d;
      if (i < 0 || j < 0 || j >= m.envelopes.length) return;
      // ce qui est tapé dans le formulaire mais pas encore enregistré doit survivre au réaffichage
      const f = $sheet.querySelector('form[data-form="env"]'), p = top();
      if (f && p && p.type === 'editEnv') p.draft = { label: val(f, 'label'), budget: val(f, 'budget'), unit: val(f, 'unit'), occasional: checked(f, 'occasional'), paused: checked(f, 'paused'), rollover: checked(f, 'rollover') };
      m.envelopes.splice(i, 1); m.envelopes.splice(j, 0, e);
      commit();
    },
    deleteEnv(el) {
      const m = M(), id = el.getAttribute('data-id'), e = C.findById(m.envelopes, id);
      if (!e) return;
      const n = m.expenses.filter((x) => x.envelope === id).length;
      const go = () => {
        snap();
        m.envelopes = m.envelopes.filter((x) => x.id !== id);
        m.expenses = m.expenses.filter((x) => x.envelope !== id);
        // L'argent déjà déplacé vers ou depuis une autre enveloppe reste où il est :
        // de son côté, le déplacement devient un échange avec « pas encore attribué ».
        m.moves.forEach((x) => { if (x.from === id) x.from = null; if (x.to === id) x.to = null; });
        m.moves = m.moves.filter((x) => x.from !== null || x.to !== null);
        closeAll(); commit();
        toast('Enveloppe supprimée', true);
      };
      if (n) confirmSheet('Supprimer l\'enveloppe ?', e.label + ' et ' + itsExpenses(n) + ' de ce mois-ci seront effacées.', 'Supprimer', true, go);
      else go();
    },
    deleteFixed(el) {
      const m = M(), id = el.getAttribute('data-id');
      snap();
      m.fixed = m.fixed.filter((x) => x.id !== id);
      closeAll(); commit();
      toast('Prélèvement supprimé', true);
    },
    deleteIncome(el) {
      const m = M(), id = el.getAttribute('data-id');
      snap();
      m.incomes = m.incomes.filter((x) => x.id !== id);
      closeAll(); commit();
      toast('Rentrée supprimée', true);
    },
    move(el) {
      const c = cur(), to = el.getAttribute('data-to');
      const first = c.free > 0 ? '' : ((c.envs.filter((e) => e.rest > 0 && e.id !== to)[0] || {}).id || '');
      openSheet({ type: 'move', from: first, to: to || (c.envs[0] ? c.envs[0].id : ''), amount: 0 });
    },
    cover(el) {
      const c = cur(), id = el.getAttribute('data-id'), e = c.byId[id];
      if (!e) return;
      const need = -e.rest;
      const donors = c.envs.filter((o) => o.id !== id && o.rest > 0).sort((a, b) => b.rest - a.rest);
      const from = c.free >= need ? '' : (donors[0] ? donors[0].id : '');
      const room = from === '' ? c.free : (donors[0] ? donors[0].rest : 0);
      openSheet({ type: 'move', from: from, to: id, amount: Math.max(0, Math.min(need, room)) });
    },
    deleteMove(el) {
      const m = M(), id = el.getAttribute('data-id');
      snap();
      m.moves = m.moves.filter((x) => x.id !== id);
      commit();
      toast('Déplacement annulé', true);
    },
    bank() { openSheet({ type: 'bank', actual: null, focus: 'input[name="actual"]' }); },
    bankStart(el) {
      const c = cur();
      snap();
      M().startBalance = Math.max(-C.MAX, Math.min(C.MAX, c.startBalance + (+el.getAttribute('data-d'))));
      closeAll(); commit();
      toast('C\'est noté : ta feuille et ta banque sont d\'accord', true);
    },
    bankIncome(el) {
      ui.modals = [];
      ui.tab = 'feuille'; renderView();
      openSheet({ type: 'editIncome', id: null, amount: +el.getAttribute('data-d'), focus: 'input[name="label"]' });
    },
    bankExpense(el) {
      ui.modals = [];
      openSheet({ type: 'expense', mode: 'add', env: null, entry: C.fmtInput(+el.getAttribute('data-d')), fresh: true, terms: [], note: '', date: defaultDate() });
    }
  };

  /* ---------- Événements ---------- */

  // Double appui : quand le premier appui a changé l'écran, un second au même endroit dans la demi-seconde
  // tombe sur autre chose que ce qu'on visait (« Annuler », un onglet, une confirmation). On l'ignore.
  // Deux appuis sur la même commande (les touches du pavé, une case à cocher) restent permis.
  let lastTap = null, lastClick = null, pressedOnBackdrop = false;
  // Autre cas : l'écran change sans qu'on l'ait touché à cet instant (la réponse du presse-papiers arrive, un fichier
  // vient d'être lu) et une confirmation peut apparaître sous le doigt. Pendant une demi-seconde, aucun appui ne compte.
  let guardUntil = 0;
  const clockNow = () => (window.performance && performance.now ? performance.now() : Date.now());
  function armGuard() { guardUntil = clockNow() + 500; }
  const tapKey = (el) => (el === $toast ? 'toast' : ['data-act', 'data-id', 'data-k', 'data-tab', 'data-d', 'data-v', 'data-env'].map((a) => el.getAttribute(a) || '').join('|'));
  const isRepeatTap = (ev, key) => ev.detail !== 0 && !!lastTap && ev.timeStamp - lastTap.t < 500 &&
    Math.abs(ev.clientX - lastTap.x) < 40 && Math.abs(ev.clientY - lastTap.y) < 40 && key !== lastTap.key;

  // fermer en touchant le fond : seulement si l'appui a COMMENCÉ sur le fond (pas une sélection de texte qui y finit)
  ['pointerdown', 'mousedown', 'touchstart'].forEach((type) => {
    document.addEventListener(type, (ev) => {
      pressedOnBackdrop = !!(ev.target && ev.target.classList && ev.target.classList.contains('ov'));
    }, { passive: true });
  });

  document.addEventListener('click', (ev) => {
    lastClick = { t: ev.timeStamp, x: ev.clientX, y: ev.clientY, detail: ev.detail };
    // Un bouton « Enregistrer » de formulaire. On traite l'appui ici, sans attendre l'envoi du formulaire :
    // un aperçu intégré (cadre isolé) peut interdire cet envoi, et le bouton ne ferait alors rien du tout.
    // La touche Entrée dans un champ passe aussi par là : le navigateur la transforme en appui sur ce bouton.
    // Même protection contre le double appui que pour le reste.
    const sub = ev.target.closest('form[data-form] button[type="submit"]');
    if (clockNow() < guardUntil) { if (sub) ev.preventDefault(); return; }
    if (sub) {
      ev.preventDefault();
      if (!sub.disabled && !isRepeatTap(ev, 'submit')) runForm(sub.closest('form[data-form]'));
      return;
    }
    const el = ev.target.closest('[data-act]');
    const onToast = !el && !!ev.target.closest('#toast');
    if (!el && !onToast) return;
    const what = el || $toast;
    if (isRepeatTap(ev, tapKey(what))) return;
    if (onToast) { hideToast(); return; }
    if (el.disabled) return;
    if (syncDay(false)) return; // le jour a changé pendant que l'appli restait ouverte : on remet d'abord l'écran à jour
    const fn = ACT[el.getAttribute('data-act')];
    if (!fn) return;
    screenChanged = false;
    fn(el, ev);
    lastTap = screenChanged ? { t: ev.timeStamp, x: ev.clientX, y: ev.clientY, key: tapKey(el) } : null;
  });

  function runForm(f) {
    const fn = f ? FORMS[f.getAttribute('data-form')] : null;
    if (!fn) return;
    screenChanged = false;
    fn(f);
    lastTap = screenChanged && lastClick && lastClick.detail !== 0 ? { t: lastClick.t, x: lastClick.x, y: lastClick.y, key: 'submit' } : null;
  }
  // Filet de sécurité : un envoi de formulaire qui ne viendrait pas d'un appui sur son bouton.
  document.addEventListener('submit', (ev) => {
    const f = ev.target.closest('form[data-form]');
    if (!f) return;
    ev.preventDefault();
    if (clockNow() >= guardUntil) runForm(f);
  });

  document.addEventListener('input', (ev) => {
    const p = top();
    if (!p) return;
    if (ev.target.id === 'x-note') p.note = ev.target.value;
    else if (ev.target.id === 'x-date') pickDate(ev.target, false);
    else if (ev.target.closest && ev.target.closest('form[data-form]')) {
      const err = ev.target.closest('form').querySelector('.err');
      if (err) err.textContent = '';
    }
  });

  document.addEventListener('change', (ev) => {
    const t = ev.target, p0 = top();
    if (t.id === 'x-date' && p0 && p0.type === 'expense') {
      pickDate(t, true);
    } else if (t.id === 'imp-file' && t.files && t.files[0]) {
      const file = t.files[0];
      if (file.size > 5000000) { impErr('Ce fichier est trop gros pour être une sauvegarde de Reste.'); return; }
      const r = new FileReader();
      const asked = top(); // la feuille d'import d'où part la lecture
      r.onload = () => {
        if (top() !== asked) return; // fermée pendant la lecture
        importText(String(r.result || ''), true);
      };
      r.onerror = () => { impErr('Impossible de lire ce fichier.'); };
      r.readAsText(file);
      t.value = '';
    } else if (t.name === 'occasional' && t.form && t.form.getAttribute('data-form') === 'env') {
      // la case "En pause ce mois-ci" n'a de sens que pour une enveloppe "selon les mois"
      const pausedRow = t.form.elements.paused ? t.form.elements.paused.closest('.sw') : null;
      if (pausedRow) pausedRow.hidden = !t.checked;
    }
  });

  // La date choisie doit rester dans le mois de la feuille affichée.
  function pickDate(input, final) {
    const p = top(), v = input.value;
    if (!p || p.type !== 'expense') return;
    if (C.isYmd(v)) {
      if (v.slice(0, 7) === ui.month) p.date = v;
      else if (final) { input.value = p.date || ''; toast('Cette date n\'est pas dans le mois ' + C.de(C.monthName(ui.month))); }
    }
    updateExpenseSheet();
    // à l'ordinateur, le champ de date (invisible) garderait sinon le clavier : les chiffres iraient dans la date
    if (final) { const sh = $sheet.querySelector('.sh'); if (sh && document.activeElement === input) { try { sh.focus({ preventScroll: true }); } catch (e) { /* rien */ } } }
  }

  document.addEventListener('keydown', (ev) => {
    const p = top();
    if (!p) return;
    if (ev.key === 'Escape') { ev.preventDefault(); closeSheet(); return; }
    if (ev.key === 'Tab') {
      const sh = $sheet.querySelector('.sh');
      const items = sh ? Array.prototype.filter.call(sh.querySelectorAll('button, input, select, textarea'), (n) => !n.disabled && !n.hidden && n.type !== 'file' && n.offsetParent !== null) : [];
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1], active = document.activeElement;
      if (!sh.contains(active)) { ev.preventDefault(); first.focus(); }
      else if (ev.shiftKey && (active === first || active === sh)) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && active === last) { ev.preventDefault(); first.focus(); }
      return;
    }
    if (p.type !== 'expense' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const tag = ev.target && ev.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
      if (ev.key === 'Enter' && ev.target.id === 'x-note') { ev.preventDefault(); ev.target.blur(); }
      return;
    }
    if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); xKey(ev.key); }
    else if (ev.key === ',' || ev.key === '.') { ev.preventDefault(); xKey(','); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); xKey('back'); }
    else if (ev.key === '+') { ev.preventDefault(); xKey('+'); }
    else if (ev.key === 'Enter' && !(ev.target && ev.target.closest && ev.target.closest('.sh-hd'))) { ev.preventDefault(); xGo(); } // Entrée valide, même juste après avoir cliqué une enveloppe
  });

  // Sur iPhone, ouvrir le calendrier quand on touche la date
  document.addEventListener('click', (ev) => {
    const lab = ev.target.closest && ev.target.closest('.x-date');
    if (!lab) return;
    const input = lab.querySelector('input');
    const mouse = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
    if (mouse && input && input.showPicker) { try { input.showPicker(); } catch (e) { /* le navigateur gère */ } }
  });

  // Quand le clavier du téléphone s'ouvre, la feuille du bas reste visible au-dessus
  if (window.visualViewport) {
    const fit = () => {
      const vv = window.visualViewport, root = document.documentElement;
      root.style.setProperty('--vvh', vv.height + 'px');
      root.style.setProperty('--vvt', vv.offsetTop + 'px');
    };
    window.visualViewport.addEventListener('resize', fit);
    window.visualViewport.addEventListener('scroll', fit);
    fit();
  }
  document.addEventListener('focusin', (ev) => {
    const t = ev.target;
    if (t && t.closest && t.closest('.sh') && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && t.type !== 'checkbox' && t.type !== 'file') {
      setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { /* rien */ } }, 320);
    }
  });

  // Retour sur l'appli : on reprend ce qu'un autre onglet aurait enregistré, et on se met au jour d'aujourd'hui.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    adoptExternal();
    syncDay(true);
  });
  window.addEventListener('storage', (ev) => { if (ev.key === KEY) adoptExternal(); });
  // l'appli restée ouverte au premier plan passe minuit : l'affichage suit, sans attendre qu'on la touche
  setInterval(() => { if (!document.hidden) syncDay(false); }, 60000);
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onScheme = () => applyTheme();
    if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
  }
  document.addEventListener('touchstart', () => {}, { passive: true });

  /* ---------- Démarrage ---------- */
  state = load();
  ui.day = today();
  ui.month = pickMonth();
  applyTheme();
  renderView();
  if (nothingStored) recoverFromMirror();
})();

</script>
</body>
</html>
